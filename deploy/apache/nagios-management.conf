# Nagios Management Portal - HTTPS virtual host
# Static UI served by Apache; /api proxied to the portal service on 127.0.0.1:@PORT@.
# The existing Nagios web UI (/nagios, from conf-enabled/nagios.conf) stays available.
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName @SERVER_NAME@
    DocumentRoot /opt/nagios-management/frontend/dist

    SSLEngine on
    SSLCertificateFile    @CERT@
    SSLCertificateKeyFile @KEY@
    SSLProtocol           -all +TLSv1.2 +TLSv1.3
    SSLHonorCipherOrder   off
    SSLSessionTickets     off

    <Directory /opt/nagios-management/frontend/dist>
        Options -Indexes -FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.html
    </Directory>
    <LocationMatch "^/assets/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyTimeout 240
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass        /api/ http://127.0.0.1:@PORT@/api/ retry=0
    ProxyPassReverse /api/ http://127.0.0.1:@PORT@/api/

    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "no-referrer"
    Header always setifempty Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
    <Location /nagios>
        Header always unset Content-Security-Policy
        Header always unset X-Frame-Options
    </Location>
    LimitRequestBody 2097152
    TraceEnable off

    ErrorLog  ${APACHE_LOG_DIR}/nagios-management-error.log
    CustomLog ${APACHE_LOG_DIR}/nagios-management-access.log combined
</VirtualHost>
</IfModule>
